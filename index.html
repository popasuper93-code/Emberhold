<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Emberhold</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050403;font-family:system-ui,-apple-system,sans-serif;color:#f0e6d8}
canvas{display:block;position:fixed;inset:0;z-index:0}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#ui>*{pointer-events:auto}
#loading{position:fixed;inset:0;background:linear-gradient(180deg,#0c0907,#1a120c);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
.logo-big{font-size:clamp(36px,9vw,64px);font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,#ffd090,#e07020);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(255,140,40,.45));margin-bottom:6px}
.logo-sub{color:#8a7060;font-size:12px;letter-spacing:8px;text-transform:uppercase;margin-bottom:32px}
#loadBar{width:min(280px,70vw);height:5px;background:#222;border-radius:3px;overflow:hidden}
#loadBar>div{height:100%;width:0;background:linear-gradient(90deg,#c06020,#ffc070);transition:width .25s}
#lobby{position:absolute;inset:0;display:none;flex-direction:column}
#lobby.show{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);z-index:20}
.player-card{display:flex;align-items:center;gap:10px;background:rgba(20,16,12,.75);border:1px solid rgba(255,160,60,.25);border-radius:12px;padding:6px 12px 6px 6px}
.avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3a2a1a,#1a120c);border:1px solid rgba(255,160,60,.4);display:flex;align-items:center;justify-content:center;font-size:20px}
.player-info{line-height:1.2}
.player-name{font-weight:700;font-size:14px;color:#f0d0a0}
.player-lvl{font-size:11px;color:#a08060}
.currency-bar{display:flex;gap:10px;align-items:center}
.curr{display:flex;align-items:center;gap:6px;background:rgba(20,16,12,.8);border:1px solid rgba(255,180,80,.2);border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px}
.curr.gold{color:#ffd070}
.curr.ember{color:#ff8040}
.top-icons{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:10px;background:rgba(30,24,18,.8);border:1px solid rgba(255,160,60,.2);color:#e0c090;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.left-panel{position:absolute;left:12px;top:80px;display:flex;flex-direction:column;gap:10px;z-index:15;width:min(150px,28vw)}
.side-card{background:rgba(18,14,10,.82);border:1px solid rgba(255,160,60,.22);border-radius:12px;padding:10px;cursor:pointer;transition:.2s;backdrop-filter:blur(12px)}
.side-card:hover{border-color:rgba(255,180,80,.5);transform:translateX(4px)}
.side-card .title{font-size:12px;font-weight:700;color:#ffc070;margin-bottom:4px}
.side-card .desc{font-size:10px;color:#8a7060}
.right-panel{position:absolute;right:12px;top:80px;display:flex;flex-direction:column;gap:10px;z-index:15;width:min(150px,28vw)}
.right-btn{background:rgba(18,14,10,.82);border:1px solid rgba(255,160,60,.22);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;transition:.2s;backdrop-filter:blur(12px);font-size:12px;font-weight:600;color:#e0c090}
.right-btn:hover{border-color:rgba(255,180,80,.55);background:rgba(40,28,18,.9)}
.right-btn .ico{font-size:22px;display:block;margin-bottom:4px}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);z-index:15}
.play-btn{width:min(320px,85vw);height:56px;border:none;border-radius:14px;background:linear-gradient(180deg,#e89030,#c06018);color:#1a1008;font-size:18px;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 24px rgba(255,140,40,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:.2s;text-transform:uppercase}
.play-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,140,40,.5)}
.online{font-size:12px;color:#8a8070}
.menu-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mbtn-sm{padding:10px 18px;border-radius:10px;background:rgba(25,20,15,.85);border:1px solid rgba(255,160,60,.25);color:#d0b080;font-size:13px;font-weight:600;cursor:pointer}
#hud{display:none;position:absolute;inset:0;pointer-events:none}
#hud.show{display:block}
.stat-bar{position:absolute;bottom:18px;left:14px;width:160px;height:10px;background:rgba(0,0,0,.55);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.stat-bar>div{height:100%;transition:width .25s}
#hpBar{bottom:44px}#hpBar>div{background:linear-gradient(90deg,#c03020,#e05030)}
#hungerBar{bottom:30px}#hungerBar>div{background:linear-gradient(90deg,#c07020,#e0a040)}
#thirstBar{bottom:16px}#thirstBar>div{background:linear-gradient(90deg,#2060a0,#40a0e0)}
#hotbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.slot{width:52px;height:52px;background:rgba(15,12,10,.75);border:2px solid rgba(255,160,60,.22);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#bbb;position:relative}
.slot.active{border-color:#ffb040;box-shadow:0 0 14px rgba(255,160,40,.35)}
.slot .qty{position:absolute;bottom:1px;right:3px;font-size:10px;color:#fff}
#crosshair{position:absolute;top:50%;left:50%;width:14px;height:14px;transform:translate(-50%,-50%)}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff;opacity:.65}
#crosshair::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#crosshair::after{height:2px;width:100%;top:50%;transform:translateY(-50%)}
#fps{position:absolute;top:10px;left:10px;font-size:11px;color:#7a9a7a;opacity:.8}
#eventLog{position:absolute;bottom:90px;left:14px;width:260px;max-height:120px;overflow:hidden;font-size:11px;color:#c8b090;pointer-events:none}
#eventLog div{padding:1px 0;text-shadow:0 1px 2px #000}
#mobileControls{display:none;position:absolute;inset:0;pointer-events:none}
#joystickZone{position:absolute;bottom:24px;left:24px;width:130px;height:130px;pointer-events:auto}
#joystickBase{width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.12);position:relative}
#joystickKnob{width:54px;height:54px;border-radius:50%;background:rgba(255,170,70,.45);position:absolute;top:38px;left:38px;border:2px solid rgba(255,200,100,.5)}
.mbtn{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(25,20,15,.75);border:2px solid rgba(255,150,50,.35);color:#f0d0a0;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#btnFire{bottom:30px;right:30px;width:74px;height:74px;background:rgba(110,35,15,.8);font-size:13px}
#btnJump{bottom:115px;right:40px}
#btnCrouch{bottom:30px;right:120px}
#btnUse{bottom:115px;right:120px}
#btnInv{top:16px;right:16px;width:46px;height:46px}
#btnBuild{top:70px;right:16px;width:46px;height:46px}
.panel{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:82vh;overflow:auto;padding:22px;background:rgba(16,13,10,.92);border:1px solid rgba(255,160,60,.25);border-radius:16px;backdrop-filter:blur(20px);z-index:50}
.panel.show{display:block}
.panel-title{font-size:20px;font-weight:800;color:#ffc070;margin-bottom:14px;letter-spacing:1px}
.close-x{position:absolute;top:10px;right:14px;font-size:26px;color:#999;background:none;border:none;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px}
.inv-slot{width:60px;height:60px;background:rgba(0,0,0,.4);border:1px solid rgba(255,160,60,.18);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#ccc}
.btn{padding:12px 22px;font-size:14px;font-weight:600;color:#f5e6c8;background:linear-gradient(180deg,rgba(70,50,30,.95),rgba(35,25,15,.98));border:1px solid rgba(255,160,60,.35);border-radius:10px;cursor:pointer}
.btn:hover{border-color:rgba(255,180,80,.6)}
#rouletteStrip{height:110px;overflow:hidden;position:relative;margin:16px 0;border:2px solid rgba(255,160,40,.3);border-radius:8px}
#rouletteInner{display:flex;height:100%}
.skin-card{width:96px;height:100%;flex-shrink:0;margin:0 3px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;border:2px solid transparent}
.common{background:#333;border-color:#666}
.uncommon{background:#1a3a2a;border-color:#3a8a5a}
.rare{background:#1a2a4a;border-color:#4a7ada}
.epic{background:#3a1a4a;border-color:#9a4ada}
.legendary{background:#4a2a0a;border-color:#da8a2a;box-shadow:0 0 12px rgba(255,160,40,.35)}
#deathPanel{text-align:center}
</style>
</head>
<body>
<div id="loading">
  <div class="logo-big">EMBERHOLD</div>
  <div class="logo-sub">Остров Пепла</div>
  <div id="loadBar"><div id="loadProgress"></div></div>
</div>
<canvas id="c"></canvas>
<div id="ui">
  <div id="lobby">
    <div class="topbar">
      <div class="player-card">
        <div class="avatar">🔥</div>
        <div class="player-info">
          <div class="player-name">Выживший</div>
          <div class="player-lvl">Ур. 1 · Emberhold</div>
        </div>
      </div>
      <div class="currency-bar">
        <div class="curr gold">◈ <span id="coins">150</span></div>
        <div class="curr ember">🔶 <span id="embers">0</span></div>
      </div>
      <div class="top-icons"><div class="icon-btn" id="btnSettingsTop">⚙</div></div>
    </div>
    <div class="left-panel">
      <div class="side-card" id="btnShop"><div class="title">КУЗНИЦА</div><div class="desc">Магазин и акции</div></div>
      <div class="side-card" id="btnCases"><div class="title">КЕЙСЫ</div><div class="desc">Рулетка скинов</div></div>
      <div class="side-card" id="btnDaily"><div class="title">НАГРАДЫ</div><div class="desc">Ежедневный бонус</div></div>
    </div>
    <div class="right-panel">
      <div class="right-btn" id="btnMissions"><span class="ico">📋</span>Миссии</div>
      <div class="right-btn" id="btnSkins"><span class="ico">🎨</span>Скины</div>
      <div class="right-btn" id="btnClans"><span class="ico">🛡</span>Кланы</div>
      <div class="right-btn" id="btnInventoryLobby"><span class="ico">🎒</span>Инвентарь</div>
    </div>
    <div class="bottom-bar">
      <button class="play-btn" id="btnPlay">ИГРАТЬ</button>
      <div class="online" id="onlineCount">Онлайн: —</div>
      <div class="menu-row">
        <button class="mbtn-sm" id="btnSettings">Настройки</button>
        <button class="mbtn-sm" id="btnExit">Выход</button>
      </div>
    </div>
  </div>
  <div id="hud">
    <div id="fps">60 FPS</div>
    <div id="crosshair"></div>
    <div class="stat-bar" id="hpBar"><div id="hpFill" style="width:100%"></div></div>
    <div class="stat-bar" id="hungerBar"><div id="hungerFill" style="width:100%"></div></div>
    <div class="stat-bar" id="thirstBar"><div id="thirstFill" style="width:100%"></div></div>
    <div id="hotbar"></div>
    <div id="eventLog"></div>
  </div>
  <div id="mobileControls">
    <div id="joystickZone"><div id="joystickBase"><div id="joystickKnob"></div></div></div>
    <button class="mbtn" id="btnFire">ОГОНЬ</button>
    <button class="mbtn" id="btnJump">ПРЫЖОК</button>
    <button class="mbtn" id="btnCrouch">ПРИСЕД</button>
    <button class="mbtn" id="btnUse">E</button>
    <button class="mbtn" id="btnInv">ИНВ</button>
    <button class="mbtn" id="btnBuild">СТРОЙ</button>
  </div>
  <div class="panel" id="inventoryPanel">
    <button class="close-x" data-close="inventoryPanel">×</button>
    <div class="panel-title">Инвентарь</div>
    <div class="grid" id="invGrid"></div>
  </div>
  <div class="panel" id="craftPanel">
    <button class="close-x" data-close="craftPanel">×</button>
    <div class="panel-title">Крафт</div>
    <div id="craftList" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
  <div class="panel" id="roulettePanel">
    <button class="close-x" data-close="roulettePanel">×</button>
    <div class="panel-title">Рулетка скинов</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn" data-case="cheap">Обычный · 50◈</button>
      <button class="btn" data-case="mid">Редкий · 200◈</button>
      <button class="btn" data-case="high">Легендарный · 800◈</button>
    </div>
    <div id="rouletteStrip"><div id="rouletteInner"></div></div>
    <div id="rouletteResult" style="text-align:center;font-size:16px;min-height:24px;color:#ffc070"></div>
  </div>
  <div class="panel" id="settingsPanel">
    <button class="close-x" data-close="settingsPanel">×</button>
    <div class="panel-title">Настройки</div>
    <div style="display:flex;flex-direction:column;gap:12px;font-size:14px">
      <label>Графика: <select id="setQuality"><option>Low</option><option selected>Medium</option><option>High</option><option>Ultra</option></select></label>
      <label>FOV: <input type="range" id="setFov" min="60" max="110" value="75"></label>
      <label>Чувствительность: <input type="range" id="setSens" min="0.5" max="3" step="0.1" value="1.2"></label>
      <label>Громкость: <input type="range" id="setVol" min="0" max="1" step="0.05" value="0.7"></label>
      <label><input type="checkbox" id="setFps" checked> Показывать FPS</label>
      <button class="btn" id="btnReset">Сброс прогресса</button>
    </div>
  </div>
  <div class="panel" id="deathPanel">
    <div class="panel-title" style="color:#e05040">Ты погиб</div>
    <div id="deathReason" style="margin:10px 0;color:#c0a080"></div>
    <button class="btn" id="btnRespawn">Респаун</button>
    <button class="btn" id="btnRespawnRandom" style="margin-top:8px">Случайная точка</button>
  </div>
</div>
<script type="importmap">

</body>
</html>
