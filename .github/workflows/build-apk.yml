name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set landscape + keep screen on
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/g' "$MANIFEST" || true
            if ! grep -q 'android:screenOrientation' "$MANIFEST"; then
              sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' "$MANIFEST" || true
            fi
            if ! grep -q 'android:keepScreenOn' "$MANIFEST"; then
              sed -i 's/<activity /<activity android:keepScreenOn="true" /' "$MANIFEST" || true
            fi
          fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emberhold-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
